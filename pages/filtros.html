<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MundoEnCifras · Filtros</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header class="cabecera">
    <a class="cabecera__logo" href="../index.html">Mundo<span>EnCifras</span></a>
    <nav class="cabecera__nav" aria-label="Principal">
      <a href="../index.html">Resumen</a>
      <a href="detalle.html">Detalle</a>
      <a href="filtros.html" aria-current="page">Filtros</a>
    </nav>
  </header>

  <main class="contenido">
    <h1>Buscar y filtrar países</h1>
    <p class="intro">Combina los filtros: los resultados se actualizan al instante.</p>

    <form class="controles" id="form-filtros" onsubmit="return false" role="search">
      <label>Buscar por nombre o capital
        <input type="search" id="busqueda" placeholder="Ej.: Perú, Lima…" autocomplete="off" disabled>
      </label>
      <label>Región
        <select id="region" disabled>
          <option value="">Todas las regiones</option>
        </select>
      </label>
      <label>Nivel de ingresos
        <select id="ingresos" disabled>
          <option value="">Todos los niveles</option>
        </select>
      </label>
      <label>Esperanza de vida mínima: <output id="vida-valor">0 años</output>
        <input type="range" id="vida" min="0" max="85" step="5" value="0" disabled>
      </label>
      <label>Ordenar por
        <select id="orden" disabled>
          <option value="nombre">Nombre (A-Z)</option>
          <option value="pibPerCapita">PIB per cápita</option>
          <option value="poblacion">Población</option>
          <option value="esperanzaVida">Esperanza de vida</option>
          <option value="crecimientoPib">Crecimiento del PIB</option>
        </select>
      </label>
      <button type="button" id="limpiar" class="boton boton--secundario" disabled>Limpiar filtros</button>
    </form>

    <p id="contador" class="contador" aria-live="polite"></p>
    <section id="resultados"></section>
  </main>

  <footer class="pie">
    Datos: <a href="https://data.worldbank.org/" target="_blank" rel="noopener">World Bank Open Data</a>
  </footer>

  <script type="module" src="../js/pages/filtros.js"></script>
</body>
</html>
